name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      # The real test suite for this repo lives in hexagdly-oracle (see its
      # README): tests/ here only keeps what's genuinely local. Checked out
      # as a sibling dir and put on PYTHONPATH rather than pip-installed,
      # since its wheel doesn't ship tests/ (only src/hexagdly_oracle).
      - name: Checkout hexagdly-oracle
        uses: actions/checkout@v4
        with:
          repository: YugnatD/hexagdly-oracle
          path: hexagdly-oracle

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytorch-hexagdly + dev deps
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          pip install numpy

      - name: Run local tests
        run: pytest tests/ -v

      - name: Run hexagdly-oracle's pytorch-side tests
        # keras_hexagdly isn't installed here, so keras-only parametrizations
        # and test_cross_framework.py are collected but skipped, not run.
        env:
          PYTHONPATH: ${{ github.workspace }}/hexagdly-oracle/src
        run: pytest hexagdly-oracle/tests/ -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pinned: an unpinned ruff picks up new default rules on every release
      # and turns this job red without any change here. Bump deliberately.
      - name: Install ruff
        run: pip install ruff==0.16.5
      - name: Ruff check
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/
